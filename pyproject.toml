[project]
name = "petkit-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypetkitapi>=1.22.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "temporalio>=1.35.0",
    "google-cloud-firestore>=2.34.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
